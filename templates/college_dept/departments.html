<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Departments - Government Polytechnic, Chhatrapati Sambhajinagar</title>
  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='favicon/apple-touch-icon.png') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon/favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon/favicon-16x16.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='favicon/site.webmanifest') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}">

  
  <!-- CSS Links -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/footer.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    .dept-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.3);
      text-decoration: none;
      color: #333;
      display: block;
    }
    .dept-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
      color: #0b3c5d;
    }
    .dept-icon {
      font-size: 2.5rem;
      color: #c1121f;
      margin-bottom: 15px;
    }
    .category-title {
      border-left: 5px solid #c1121f;
      padding-left: 15px;
      margin: 40px 0 25px;
      color: #0b3c5d;
      font-weight: 700;
    }
    main {
      padding: 50px 0;
      background: #f4f6f9;
    }
    .breadcrumb {
      background: transparent;
      padding: 0;
      margin-bottom: 30px;
    }
    .breadcrumb a {
      color: #666;
      text-decoration: none;
    }
    .breadcrumb .active {
      color: #c1121f;
    }
    body.dark {
      background: #121212;
      color: #f1f1f1;
    }
    body.dark main {
      background: #1a1a1a;
    }
    body.dark .dept-card {
      background: rgba(40, 40, 40, 0.9);
      color: #f1f1f1;
      border-color: rgba(255, 255, 255, 0.1);
    }
    body.dark .category-title {
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- UTILITY BAR & HEADER & NAVBAR (Using base.html logic ideally, but replicating for standalone) -->
  <!-- For now, I'll include the header and nav manually as requested to keep standalone structure -->
  
  <div id="header-placeholder"></div>

  <main>
    <div class="container">
      <nav class="breadcrumb">
        <a href="{{ url_for('home') }}">Home</a> &nbsp;>&nbsp; <span class="active">Departments</span>
      </nav>

      <h1 class="mb-5 text-center" style="font-weight: 800; color: #0b3c5d;">Our Departments</h1>

      <div id="departments-list">
        <!-- Will be populated by JS -->
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="{{ url_for('static', filename='js/departments-data.js') }}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('departments-list');
      const categories = DEPARTMENTS_DATA.departmentCategories;

      for (const [categoryName, depts] of Object.entries(categories)) {
        const categoryDiv = document.createElement('div');
        categoryDiv.innerHTML = `<h2 class="category-title">${categoryName}</h2>`;
        
        const row = document.createElement('div');
        row.className = 'row';
        
        depts.forEach(dept => {
          const col = document.createElement('div');
          col.className = 'col-md-4';
          
          // Map slugs to icons
          const icons = {
            'aiml': 'fa-brain',
            'auto': 'fa-car',
            'civil': 'fa-building',
            'computer': 'fa-laptop-code',
            'ddgm': 'fa-shirt',
            'electrical': 'fa-bolt',
            'entc': 'fa-microchip',
            'it': 'fa-network-wired',
            'mechanical': 'fa-gears',
            'science-humanities': 'fa-microscope',
            'applied-mechanics': 'fa-compass-drafting',
            'workshop': 'fa-tools',
            'mercedes-benz': 'fa-star'
          };
          
          const icon = icons[dept.slug] || 'fa-graduation-cap';
          
          col.innerHTML = `
            <a href="/dept/${dept.slug}" class="dept-card text-center">
              <div class="dept-icon"><i class="fas ${icon}"></i></div>
              <h3>${dept.name}</h3>
              <p class="text-muted">Diploma Programme</p>
            </a>
          `;
          row.appendChild(col);
        });
        
        categoryDiv.appendChild(row);
        container.appendChild(categoryDiv);
      }
    });
  </script>

  <!-- Replicating the Global Header/Footer Fetch logic if needed, or just include base parts -->
  <!-- Since I converted most files to use base.html, I'll try to use it if I can, but standalone is safer for now -->
  <script>
    // Fetch header and footer if they are external, or just use the ones from base.html
    // For this prototype, I'll use the ones already in base.html
    // Actually, I'll just make this page EXTEND base.html in the next step to be clean.
  </script>
  <!-- FOOTER -->
  {% include 'footer_content.html' %}
</body>
</html>
